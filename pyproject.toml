[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rsflowhub"
dynamic = ["version"]
description = "Official Python SDK for the RSFlowHub AI API: sentiment analysis, translation, chat, PII redaction, review and ticket AI, knowledge bases (RAG) and chatbots. Sync and async. New APIs work without an SDK update."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "RSFlowHub", email = "support@rsflowhub.com" }]
keywords = [
    "rsflowhub", "ai", "ai-api", "sdk", "sentiment-analysis", "translation",
    "chatbot", "rag", "knowledge-base", "pii-redaction", "django", "fastapi", "asyncio",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.23,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[project.urls]
Homepage = "https://rsflowhub.com"
Documentation = "https://rsflowhub.com/docs"
Source = "https://github.com/RSFlowHub/rsflowhub-python"
Issues = "https://github.com/RSFlowHub/rsflowhub-python/issues"
Changelog = "https://github.com/RSFlowHub/rsflowhub-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/rsflowhub/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rsflowhub"]

[tool.hatch.build.targets.sdist]
include = ["src/rsflowhub", "README.md", "LICENSE", "CHANGELOG.md", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/rsflowhub"]
