name: Release

# Push a tag like v1.2.0 (matching src/rsflowhub/_version.py) to publish to PyPI
# and create the GitHub Release. Uses PyPI trusted publishing (no token): on
# pypi.org add a (pending) publisher for owner RSFlowHub, repository
# rsflowhub-python, workflow release.yml, environment "pypi".

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag must match __version__
        run: |
          VERSION=$(python -c "import re;print(re.search(r'\"(.+)\"', open('src/rsflowhub/_version.py').read()).group(1))")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $VERSION"; exit 1
          fi
      - run: pip install -e ".[dev]" build
      - run: pytest -q && mypy
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
